<!DOCTYPE html>
<html>

<head>
  <title>jsPsychPluginSentenceCompletion Example</title>
  <script src="https://unpkg.com/jspsych"></script>
  <!-- Load the published plugin package here, e.g.
<script src="https://unpkg.com/plugin-sentence-completion"></script>
<script src="../dist/index.global.js"></script> -->
  <script src="../src/index.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych/css/jspsych.css">
</head>

<body></body>
<script>
  const jsPsych = initJsPsych({
    on_finish: function() {
        jsPsych.data.displayData();
      }
  });

  const trial = {
    type: jsPsychPluginSentenceCompletion,
    // sentence: "The wizard #w the queen a gift.",
    choices: ["wizard", "give", "-s", "queen", "gift"],
    randomize_order: true,
    allow_duplicates: true,
    use_all_buttons: false,
    grid_rows: 3, 
    prompt: "Press a button to complete the sentence:",
  };

  jsPsych.run([trial])
</script>

</html>
